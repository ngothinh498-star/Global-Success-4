<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bi Biệt Đội Siêu Đẳng - Tiếng Anh 7 (Unit 1, 2, 3)</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #FF5A5F;
      --secondary: #00A699;
      --yellow: #FC642D;
      --accent: #4B6584;
      --purple: #6C5CE7;
      --dark: #2F3542;
      --card-bg: #FFFFFF;
      --success: #20BF6B;
      --error: #EB3B5A;
      --bg-gradient: linear-gradient(135deg, #74ebd5 0%, #9face6 100%);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Quicksand', sans-serif;
      background: var(--bg-gradient);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px;
    }

    .app-card {
      background: var(--card-bg);
      width: 100%;
      max-width: 820px;
      border-radius: 28px;
      box-shadow: 0 16px 40px rgba(0,0,0,0.15), 0 6px 0 var(--purple);
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* HUD Bar */
    .hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #F1F2F6;
      padding: 8px 16px;
      border-radius: 16px;
    }

    .badge-unit {
      background: var(--purple);
      color: #fff;
      font-family: 'Fredoka One', cursive;
      padding: 6px 14px;
      border-radius: 12px;
      font-size: 13px;
    }

    .hud-metrics {
      display: flex;
      gap: 14px;
      font-family: 'Fredoka One', cursive;
      font-size: 17px;
      color: var(--dark);
    }

    /* Progress bar */
    .bar-container {
      width: 100%;
      height: 10px;
      background: #E4E7EB;
      border-radius: 10px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      width: 3.33%;
      background: linear-gradient(90deg, #FF5A5F, #FC642D, #00A699);
      border-radius: 10px;
      transition: width 0.3s ease;
    }

    /* Mascot Dialogue */
    .mascot-box {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #FFF9E6;
      border: 2px solid #FFEAA7;
      border-radius: 16px;
      padding: 8px 14px;
    }

    .mascot-face {
      font-size: 38px;
      line-height: 1;
    }

    .mascot-speech {
      font-size: 14px;
      font-weight: 700;
      color: #574B90;
      flex: 1;
    }

    /* Challenge Frame */
    .challenge-panel {
      background: #E8F8F5;
      border-left: 5px solid var(--secondary);
      border-radius: 14px;
      padding: 12px 16px;
    }

    .challenge-badge {
      font-size: 12px;
      font-weight: 800;
      color: var(--secondary);
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 3px;
    }

    .challenge-title {
      font-size: 17px;
      font-weight: 800;
      color: var(--dark);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .btn-sound {
      background: white;
      border: 2px solid #A3E4D7;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      cursor: pointer;
      font-size: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    /* Activity Zone */
    .work-area {
      min-height: 170px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    /* Scramble */
    .tray-zone {
      min-height: 52px;
      background: #F8F9FA;
      border: 2px dashed #A4B0BE;
      border-radius: 14px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 8px 12px;
      align-items: center;
      margin-bottom: 12px;
    }

    .word-pool {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }

    .chip-btn {
      background: #FFF;
      border: 2px solid #CED6E0;
      border-bottom: 4px solid #A4B0BE;
      border-radius: 12px;
      padding: 8px 14px;
      font-size: 15px;
      font-weight: 800;
      color: #2F3542;
      cursor: pointer;
    }

    .chip-btn:active {
      transform: translateY(2px);
      border-bottom-width: 2px;
    }

    .chip-btn.hidden {
      visibility: hidden;
      pointer-events: none;
    }

    .chip-btn.tray-word {
      background: #DFF9FB;
      border-color: #22A6B3;
      border-bottom-color: #0984E3;
      color: #0984E3;
    }

    /* Sort Baskets */
    .basket-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 12px;
    }

    .basket-card {
      background: #F8F9FA;
      border: 2px solid #DFE4EA;
      border-radius: 16px;
      padding: 10px;
      text-align: center;
      min-height: 110px;
      cursor: pointer;
    }

    .basket-title {
      font-family: 'Fredoka One', cursive;
      font-size: 14px;
      color: white;
      padding: 4px 10px;
      border-radius: 8px;
      margin-bottom: 8px;
      display: inline-block;
    }

    .basket-items-box {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
    }

    .sorted-pill {
      background: white;
      border: 1px solid #CED6E0;
      border-radius: 8px;
      padding: 4px 8px;
      font-size: 12px;
      font-weight: 800;
      color: #2F3542;
    }

    .candidate-pool {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }

    .candidate-btn {
      background: white;
      border: 2px solid #747D8C;
      border-bottom: 4px solid #57606F;
      border-radius: 12px;
      padding: 8px 12px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
    }

    .candidate-btn.active {
      background: #FFEAA7;
      border-color: #E17055;
      border-bottom-color: #D63031;
      transform: scale(1.05);
    }

    /* MCQ & Bug */
    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    @media (max-width: 540px) {
      .options-grid { grid-template-columns: 1fr; }
      .basket-grid { grid-template-columns: 1fr; }
    }

    .choice-card {
      background: #FFF;
      border: 2px solid #DFE4EA;
      border-bottom: 4px solid #CED6E0;
      border-radius: 14px;
      padding: 12px 14px;
      font-size: 15px;
      font-weight: 800;
      color: var(--dark);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      text-align: left;
    }

    .choice-card.correct {
      background: #E8F8F5 !important;
      border-color: #20BF6B !important;
      border-bottom-color: #0EB35A !important;
      color: #0EB35A !important;
    }

    .choice-card.wrong {
      background: #FDEDEC !important;
      border-color: #EB3B5A !important;
      border-bottom-color: #D92040 !important;
      color: #D92040 !important;
    }

    .bug-stream {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      padding: 10px 0;
    }

    /* Explanation */
    .exp-panel {
      display: none;
      background: #FFF8E7;
      border: 2px solid #F7D794;
      border-radius: 14px;
      padding: 10px 14px;
    }

    .exp-title {
      font-family: 'Fredoka One', cursive;
      font-size: 14px;
      color: #E67E22;
      margin-bottom: 2px;
    }

    .exp-text {
      font-size: 13.5px;
      color: #78350F;
      font-weight: 700;
      line-height: 1.4;
    }

    /* Action Button */
    .btn-main {
      background: var(--primary);
      color: #fff;
      border: none;
      border-bottom: 4px solid #D63031;
      border-radius: 16px;
      padding: 14px;
      font-size: 17px;
      font-family: 'Fredoka One', cursive;
      cursor: pointer;
      width: 100%;
      letter-spacing: 0.5px;
    }

    .btn-main:active {
      transform: translateY(2px);
      border-bottom-width: 2px;
    }

    /* Finish View */
    .end-panel {
      display: none;
      text-align: center;
      padding: 24px 0;
    }
  </style>
</head>
<body>

  <div class="app-card">
    <div id="quiz-flow" style="display: flex; flex-direction: column; gap: 12px;">
      <!-- HUD -->
      <div class="hud">
        <span class="badge-unit" id="hud-unit">Unit 1: Hobbies</span>
        <div class="hud-metrics">
          <div>⭐ <span id="num-score">0</span></div>
          <div>❤️ <span id="num-lives">3</span></div>
          <div style="color: #FC642D;">🔥 <span id="num-streak">0</span></div>
        </div>
      </div>

      <!-- Bar -->
      <div class="bar-container">
        <div class="bar-fill" id="bar-fill"></div>
      </div>

      <!-- Mascot -->
      <div class="mascot-box">
        <div class="mascot-face" id="mascot-emoji">🦊</div>
        <div class="mascot-speech" id="mascot-msg">Xin chào học sinh lớp 7! Cùng Cáo Siêu Đẳng bứt phá 30 câu hỏi nhé!</div>
      </div>

      <!-- Challenge Header -->
      <div class="challenge-panel">
        <div class="challenge-badge" id="mission-type">DẠNG BÀI: XẾP CÂU</div>
        <div class="challenge-title">
          <span id="mission-title">Loading...</span>
          <button class="btn-sound" title="Phát âm câu hỏi" onclick="speakText()">🔊</button>
        </div>
      </div>

      <!-- Main Activity Area -->
      <div class="work-area" id="work-area"></div>

      <!-- Explanation -->
      <div class="exp-panel" id="exp-panel">
        <div class="exp-title">💡 Mẹo Ghi Nhớ Sâu Của Cáo Vàng:</div>
        <div class="exp-text" id="exp-text">...</div>
      </div>

      <!-- Button Submit/Next -->
      <button class="btn-main" id="btn-submit" onclick="onActionClick()">Kiểm Tra Đáp Án 🚀</button>
    </div>

    <!-- Final Result -->
    <div class="end-panel" id="end-panel">
      <div style="font-size: 72px;">🎖️</div>
      <h2 style="font-family: 'Fredoka One', cursive; font-size: 28px; color: var(--dark); margin: 8px 0;" id="end-title">Tuyệt Đỉnh Tiếng Anh 7!</h2>
      <div style="display: inline-block; background: #FFEAA7; color: #D63031; font-family: 'Fredoka One'; font-size: 22px; padding: 8px 26px; border-radius: 20px; margin-bottom: 12px;" id="end-score">
        300 / 300 Điểm
      </div>
      <p style="font-weight: 700; color: #4B6584; font-size: 15px; margin-bottom: 18px;" id="end-desc">
        Bé đã xuất sắc chinh phục trọn vẹn kiến thức Unit 1, 2 và 3!
      </p>
      <button class="btn-main" style="max-width: 240px; margin: 0 auto;" onclick="resetQuiz()">Chơi Lại Trận Mới 🔁</button>
    </div>
  </div>

  <script>
    // BỘ ĐỀ 30 CÂU LỚP 7 (UNIT 1, 2, 3) - ĐA DẠNG 4 HÌNH THỨC - KHÔNG CÓ PHÁT ÂM
    const testBank = [
      /* ================= UNIT 1: HOBBIES (10 CÂU) ================= */
      // Câu 1: Scramble
      {
        type: 'scramble',
        unit: 'Unit 1: Hobbies',
        title: 'Sắp xếp câu về thói quen sau giờ học:',
        words: ['My', 'sister', 'loves', 'making', 'models', 'after', 'school.'],
        solution: 'My sister loves making models after school.',
        tip: 'Động từ chỉ sở thích <b>love</b> đi với danh động từ <b>V-ing</b> (making). <i>Making models</i> nghĩa là làm mô hình đồ chơi.'
      },
      // Câu 2: Basket Sort
      {
        type: 'sort',
        unit: 'Unit 1: Hobbies',
        title: 'Xếp các sở thích vào đúng nhóm DO hoặc PLAY:',
        baskets: [
          { id: 'do', name: 'DO 🥋', bg: '#FF5A5F' },
          { id: 'play', name: 'PLAY 🏀', bg: '#00A699' }
        ],
        items: [
          { text: 'yoga', basket: 'do' },
          { text: 'basketball', basket: 'play' },
          { text: 'judo', basket: 'do' },
          { text: 'table tennis', basket: 'play' }
        ],
        tip: '<b>PLAY</b> đi với môn thể thao đồng đội hoặc có quả bóng (basketball, table tennis). <b>DO</b> đi với võ thuật và bài tập thể lực (yoga, judo).'
      },
      // Câu 3: Bug Hunter
      {
        type: 'bug',
        unit: 'Unit 1: Hobbies',
        title: 'Bắt sâu! Bấm vào từ sai dạng sau động từ "enjoy":',
        tokens: ['Minh', 'enjoys', 'collect', 'stamps', 'in', 'his', 'free', 'time.'],
        bugWord: 'collect',
        tip: 'Sau động từ chỉ cảm xúc <b>enjoy</b>, động từ phải ở dạng <b>V-ing</b> (sửa <i>collect</i> thành <b>collecting</b>).'
      },
      // Câu 4: MCQ
      {
        type: 'mcq',
        unit: 'Unit 1: Hobbies',
        title: 'You need to be very ______ to carve wood because it takes a lot of time.',
        options: ['patient', 'lazy', 'careless', 'quick'],
        correct: 0,
        tip: '<b>Patient</b> có nghĩa là <i>kiên nhẫn, nhẫn nại</i>. Khắc gỗ (carving wood) đòi hỏi rất nhiều sự tỉ mỉ và kiên nhẫn.'
      },
      // Câu 5: Scramble
      {
        type: 'scramble',
        unit: 'Unit 1: Hobbies',
        title: 'Xếp câu về sở thích trồng cây xanh:',
        words: ['They', 'often', 'spend', 'time', 'gardening', 'at', 'weekends.'],
        solution: 'They often spend time gardening at weekends.',
        tip: 'Cấu trúc: <b>spend time doing something</b> (dành thời gian làm việc gì, ở đây là làm vườn - <i>gardening</i>).'
      },
      // Câu 6: MCQ
      {
        type: 'mcq',
        unit: 'Unit 1: Hobbies',
        title: 'I don\'t like riding a horse because I ______ it dangerous.',
        options: ['find', 'make', 'think', 'look'],
        correct: 0,
        tip: 'Cấu trúc bày tỏ ý kiến: <b>find something + adjective</b> (cảm thấy điều gì như thế nào, ví dụ: <i>find it dangerous</i> = cảm thấy nguy hiểm).'
      },
      // Câu 7: Bug Hunter
      {
        type: 'bug',
        unit: 'Unit 1: Hobbies',
        title: 'Tìm lỗi chia động từ thì Hiện tại đơn:',
        tokens: ['My', 'brother', 'don\'t', 'like', 'playing', 'board', 'games.'],
        bugWord: 'don\'t',
        tip: 'Chủ ngữ <b>My brother</b> là ngôi thứ 3 số ít, trợ động từ phủ định phải là <b>doesn\'t</b>, không dùng <i>don\'t</i>.'
      },
      // Câu 8: Basket Sort
      {
        type: 'sort',
        unit: 'Unit 1: Hobbies',
        title: 'Xếp cụm từ đi với GO và cụm từ đi với TAKE:',
        baskets: [
          { id: 'go', name: 'GO 🏇', bg: '#6C5CE7' },
          { id: 'take', name: 'TAKE 📸', bg: '#FC642D' }
        ],
        items: [
          { text: 'horse riding', basket: 'go' },
          { text: 'photos', basket: 'take' },
          { text: 'camping', basket: 'go' },
          { text: 'notes', basket: 'take' }
        ],
        tip: 'Các hoạt động đuôi -ing rời nhà thường dùng <b>GO</b> (go camping, go horse riding); <i>take photos</i> (chụp ảnh) và <i>take notes</i> (ghi chép).'
      },
      // Câu 9: MCQ
      {
        type: 'mcq',
        unit: 'Unit 1: Hobbies',
        title: 'My uncle has a big collection of old coins. His hobby is ______ coins.',
        options: ['collecting', 'building', 'carving', 'doing'],
        correct: 0,
        tip: '<b>Collecting coins</b> là cụm từ chỉ sở thích <i>sưu tầm tiền xu</i>.'
      },
      // Câu 10: Bug Hunter
      {
        type: 'bug',
        unit: 'Unit 1: Hobbies',
        title: 'Bắt lỗi sai về động từ ghét:',
        tokens: ['She', 'hates', 'wash', 'the', 'dishes', 'every', 'evening.'],
        bugWord: 'wash',
        tip: 'Sau <b>hate</b> ta dùng V-ing: sửa <i>wash</i> thành <b>washing</b>.'
      },

      /* ================= UNIT 2: HEALTHY LIVING (10 CÂU) ================= */
      // Câu 11: Scramble
      {
        type: 'scramble',
        unit: 'Unit 2: Healthy Living',
        title: 'Sắp xếp lời khuyên bảo vệ da khi trời nắng:',
        words: ['Wear', 'a', 'hat', 'to', 'avoid', 'sunburn.'],
        solution: 'Wear a hat to avoid sunburn.',
        tip: '<b>Sunburn</b> là chứng <i>cháy nắng</i>. Đội mũ rộng vành giúp bé phòng tránh tổn thương da khi ra ngoài trời.'
      },
      // Câu 12: Basket Sort
      {
        type: 'sort',
        unit: 'Unit 2: Healthy Living',
        title: 'Phân loại thói quen LÀNH MẠNH và KHÔNG LÀNH MẠNH:',
        baskets: [
          { id: 'healthy', name: 'Healthy 🥗', bg: '#20BF6B' },
          { id: 'unhealthy', name: 'Unhealthy 🍟', bg: '#EB3B5A' }
        ],
        items: [
          { text: 'eating vegetables', basket: 'healthy' },
          { text: 'eating fast food', basket: 'unhealthy' },
          { text: 'sleeping early', basket: 'healthy' },
          { text: 'staying up late', basket: 'unhealthy' }
        ],
        tip: 'Ăn rau xanh và ngủ sớm là thói quen giúp cơ thể tràn đầy năng lượng và có làn da khỏe mạnh.'
      },
      // Câu 13: MCQ
      {
        type: 'mcq',
        unit: 'Unit 2: Healthy Living',
        title: 'Reading in dim light can ______ your eyes.',
        options: ['harm', 'improve', 'clean', 'protect'],
        correct: 0,
        tip: '<b>Harm</b> có nghĩa là <i>gây hại, làm tổn thương</i>. Đọc sách nơi ánh sáng yếu (dim light) sẽ làm hại mắt.'
      },
      // Câu 14: Bug Hunter
      {
        type: 'bug',
        unit: 'Unit 2: Healthy Living',
        title: 'Tìm liên từ dùng SAI trong câu sau:',
        tokens: ['I', 'feel', 'tired,', 'so', 'I', 'will', 'go', 'to', 'work.'],
        bugWord: 'so',
        tip: 'Hai vế tương phản (mệt mỏi nhưng vẫn phải đi làm) nên dùng liên từ <b>but</b>, không dùng <i>so</i>.'
      },
      // Câu 15: Scramble
      {
        type: 'scramble',
        unit: 'Unit 2: Healthy Living',
        title: 'Xếp câu ghép nối bởi liên từ "and":',
        words: ['Eat', 'healthy', 'food', 'and', 'do', 'more', 'exercise.'],
        solution: 'Eat healthy food and do more exercise.',
        tip: 'Lời khuyên hoàn hảo cho sức khỏe: Ăn đồ ăn bổ dưỡng <b>và (and)</b> chăm chỉ tập thể dục!'
      },
      // Câu 16: MCQ
      {
        type: 'mcq',
        unit: 'Unit 2: Healthy Living',
        title: 'Wash your face regularly, ______ your acne will get worse.',
        options: ['or', 'and', 'but', 'so'],
        correct: 0,
        tip: 'Liên từ <b>or</b> mang nghĩa <i>nếu không thì</i> (Hãy rửa mặt thường xuyên, nếu không thì mụn trứng cá sẽ nặng thêm).'
      },
      // Câu 17: Bug Hunter
      {
        type: 'bug',
        unit: 'Unit 2: Healthy Living',
        title: 'Tìm lỗi sai trong câu mệnh lệnh phủ định:',
        tokens: ['Doesn\'t', 'touch', 'your', 'face', 'with', 'dirty', 'hands.'],
        bugWord: 'Doesn\'t',
        tip: 'Câu mệnh lệnh phủ định bắt đầu bằng <b>Don\'t + V nguyên thể</b> (sửa <i>Doesn\'t</i> thành <b>Don\'t</b>).'
      },
      // Câu 18: Basket Sort
      {
        type: 'sort',
        unit: 'Unit 2: Healthy Living',
        title: 'Phân loại các vấn đề sức khỏe ngoài da và nguyên nhân:',
        baskets: [
          { id: 'problem', name: 'Triệu Chứng 🤒', bg: '#FC642D' },
          { id: 'cause', name: 'Nguyên Nhân 🔍', bg: '#4B6584' }
        ],
        items: [
          { text: 'sunburn', basket: 'problem' },
          { text: 'too much sunshine', basket: 'cause' },
          { text: 'chapped lips', basket: 'problem' },
          { text: 'dry cold weather', basket: 'cause' }
        ],
        tip: '<i>Sunburn</i> (cháy nắng) do nắng gắt, <i>chapped lips</i> (nứt môi) do thời tiết hanh khô.'
      },
      // Câu 19: MCQ
      {
        type: 'mcq',
        unit: 'Unit 2: Healthy Living',
        title: 'Tofu is a healthy product. It is rich in ______.',
        options: ['protein', 'sugar', 'fat', 'smoke'],

      },
      // Câu 20: Bug Hunter
      {

        title: 'Bắt sâu! Liên từ nào diễn tả quan hệ nguyên nhân - kết quả sai?',
        tokens: ['He', 'ate', 'too', 'much,', 'but', 'he', 'had', 'stomachache.'],

        tip: 'Ăn quá nhiều dẫn đến hậu quả bị đau bụng, ta phải dùng liên từ chỉ kết quả là <b>so</b> (vì vậy), không dùng <i>but</i>.'
      },

      /* ================= UNIT 3: COMMUNITY SERVICE (10 CÂU) ================= */
      // Câu 21: Scramble
      {
        type: 'scramble',
        unit: 'Unit 3: Community Service',
        title: 'Xếp câu hoạt động tình nguyện tuần trước:',
        words: ['We', 'donated', 'warm', 'clothes', 'to', 'homeless', 'children.'],
        solution: 'We donated warm clothes to homeless children.',
        tip: 'Thì Quá khứ đơn: <b>donated</b> (đã quyên góp). <i>Homeless children</i> là các em nhỏ không nơi nương tựa.'
      },
      // Câu 22: Basket Sort
      {
        type: 'sort',
        unit: 'Unit 3: Community Service',
        title: 'Phân loại động từ BẤT QUY TẮC và CÓ QUY TẮC ở thì Quá khứ:',
        baskets: [
          { id: 'reg', name: 'Có quy tắc (-ed) 📝', bg: '#00A699' },
          { id: 'irreg', name: 'Bất quy tắc 🌟', bg: '#6C5CE7' }
        ],
        items: [
          { text: 'donated', basket: 'reg' },
          { text: 'taught', basket: 'irreg' },
          { text: 'planted', basket: 'reg' },
          { text: 'gave', basket: 'irreg' }
        ],
        tip: 'Động từ bất quy tắc: <i>teach -> taught, give -> gave</i>. Động từ có quy tắc chỉ cần thêm đuôi -ed: <i>donated, planted</i>.'
      },
      // Câu 23: Bug Hunter
      {
        type: 'bug',
        unit: 'Unit 3: Community Service',
        title: 'Tìm từ chia sai thì quá khứ của "yesterday":',
        tokens: ['The', 'volunteers', 'clean', 'the', 'park', 'yesterday', 'afternoon.'],
        bugWord: 'clean',
        tip: 'Có dấu hiệu thời gian trong quá khứ <b>yesterday afternoon</b>, động từ <i>clean</i> phải chia ở quá khứ là <b>cleaned</b>.'
      },
      // Câu 24: MCQ
      {
        type: 'mcq',
        unit: 'Unit 3: Community Service',
        title: 'Last Sunday, we visited the elderly at a local ______ and talked to them.',
        options: ['nursing home', 'supermarket', 'cinema', 'police station'],
        correct: 0,
        tip: '<b>Nursing home</b> là <i>viện dưỡng lão</i> — nơi sinh sống và chăm sóc sức khỏe cho người cao tuổi.'
      },
      // Câu 25: Scramble
      {
        type: 'scramble',
        unit: 'Unit 3: Community Service',
        title: 'Xếp câu về hoạt động dạy kèm môn Toán:',
        words: ['Tom', 'tutored', 'maths', 'for', 'primary', 'students', 'last', 'summer.'],
        solution: 'Tom tutored maths for primary students last summer.',
        tip: '<b>Tutor</b> nghĩa là <i>dạy kèm, gia sư</i>. Thì quá khứ đơn của từ này là <b>tutored</b>.'
      },
      // Câu 26: MCQ
      {
        type: 'mcq',
        unit: 'Unit 3: Community Service',
        title: 'Our club ______ hundreds of books to rural schools two months ago.',
        options: ['sent', 'send', 'sending', 'sends'],
        correct: 0,
        tip: 'Dấu hiệu <b>two months ago</b> chỉ thời điểm quá khứ, dạng quá khứ của <i>send</i> là <b>sent</b>.'
      },
      // Câu 27: Bug Hunter
      {
        type: 'bug',
        unit: 'Unit 3: Community Service',
        title: 'Bắt sâu! Trợ động từ phủ định ở thì Quá khứ đơn:',
        tokens: ['They', 'didn\'t', 'went', 'camping', 'with', 'us', 'last', 'weekend.'],
        bugWord: 'went',
        tip: 'Sau trợ động từ phủ định <b>didn\'t</b>, động từ chính phải trở về dạng <b>nguyên thể</b> (sửa <i>went</i> thành <b>go</b>).'
      },
      // Câu 28: Basket Sort
      {
        type: 'sort',
        unit: 'Unit 3: Community Service',
        title: 'Phân loại đồ vật có thể QUYÊN GÓP (DONATE) và hoạt động DỌN DẸP (CLEAN):',
        baskets: [
          { id: 'donate', name: 'Đồ Quyên Góp 🎁', bg: '#FC642D' },
          { id: 'clean', name: 'Dọn Dẹp Môi Trường 🧹', bg: '#20BF6B' }
        ],
        items: [
          { text: 'used books', basket: 'donate' },
          { text: 'plastic bottles in the lake', basket: 'clean' },
          { text: 'old clothes', basket: 'donate' },
          { text: 'litter on the streets', basket: 'clean' }
        ],
        tip: 'Sách cũ và quần áo ấm có thể <b>quyên góp (donate)</b>; còn rác thải chai nhựa trên hồ và đường phố cần được <b>thu gom, dọn sạch (clean up)</b>.'
      },
      // Câu 29: MCQ
      {
        type: 'mcq',
        unit: 'Unit 3: Community Service',
        title: 'Did you ______ part in the Green Summer project last year?',
        options: ['take', 'took', 'taken', 'taking'],
        correct: 0,
        tip: 'Trong câu hỏi đảo thì quá khứ với <b>Did + S + V nguyên thể</b>, ta dùng <b>take</b> (cụm từ <i>take part in</i> = tham gia).'
      },
      // Câu 30: Scramble
      {
        type: 'scramble',
        unit: 'Unit 3: Community Service',
        title: 'Xếp câu về hoạt động nhặt rác bảo vệ bãi biển:',
        words: ['Students', 'picked', 'up', 'litter', 'along', 'the', 'beach.'],
        solution: 'Students picked up litter along the beach.',
        tip: 'Cụm động từ quá khứ: <b>picked up litter</b> nghĩa là <i>đã nhặt rác</i>.'
      }
    ];

    let currentIdx = 0;
    let score = 0;
    let lives = 3;
    let streak = 0;
    let isChecked = false;

    // Bộ nhớ đệm cho từng dạng
    let scrambleSelected = [];
    let sortState = {};
    let activeSortItem = null;

    // Âm thanh an toàn (Web Audio API bọc try-catch, không lag)
    function playSound(type) {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        if (type === 'click') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(500, ctx.currentTime);
          gain.gain.setValueAtTime(0.12, ctx.currentTime);
          gain.gain.linearRampToValueAtTime(0.01, ctx.currentTime + 0.05);
          osc.start();
          osc.stop(ctx.currentTime + 0.05);
        } else if (type === 'win') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(523, ctx.currentTime);
          osc.frequency.setValueAtTime(659, ctx.currentTime + 0.08);
          osc.frequency.setValueAtTime(783, ctx.currentTime + 0.16);
          gain.gain.setValueAtTime(0.2, ctx.currentTime);
          gain.gain.linearRampToValueAtTime(0.01, ctx.currentTime + 0.3);
          osc.start();
          osc.stop(ctx.currentTime + 0.3);
        } else if (type === 'lose') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(240, ctx.currentTime);
          osc.frequency.setValueAtTime(140, ctx.currentTime + 0.12);
          gain.gain.setValueAtTime(0.18, ctx.currentTime);
          gain.gain.linearRampToValueAtTime(0.01, ctx.currentTime + 0.25);
          osc.start();
          osc.stop(ctx.currentTime + 0.25);
        }
      } catch (err) {}
    }

    // Đọc phát âm câu tiếng Anh
    function speakText() {
      try {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const q = testBank[currentIdx];
          let speech = q.type === 'scramble' ? q.solution : (q.type === 'bug' ? q.tokens.join(' ') : q.title);
          speech = speech.replace(/______/g, "blank");
          const u = new SpeechSynthesisUtterance(speech);
          u.lang = 'en-US';
          u.rate = 0.88;
          window.speechSynthesis.speak(u);
        }
      } catch (e) {}
    }

    // Nạp câu hỏi
    function loadQuiz() {
      isChecked = false;
      const q = testBank[currentIdx];

      document.getElementById('hud-unit').textContent = q.unit;
      document.getElementById('mission-title').textContent = q.title;
      document.getElementById('bar-fill').style.width = `${((currentIdx + 1) / testBank.length) * 100}%`;
      document.getElementById('exp-panel').style.display = 'none';

      const btn = document.getElementById('btn-submit');
      btn.style.display = 'block';

      const area = document.getElementById('work-area');
      area.innerHTML = '';

      setMascot('🦊', "Tập trung cao độ và giành trọn điểm nhé!");

      if (q.type === 'scramble') {
        document.getElementById('mission-type').textContent = '🧩 Dạng 1: Xếp từ thành câu chuẩn';
        btn.textContent = 'Kiểm Tra Câu Này 🚀';
        renderScramble(q, area);
      } else if (q.type === 'sort') {
        document.getElementById('mission-type').textContent = '🧺 Dạng 2: Phân loại vào giỏ chuẩn';
        btn.textContent = 'Kiểm Tra Phân Loại 🧺';
        renderSort(q, area);
      } else if (q.type === 'bug') {
        document.getElementById('mission-type').textContent = '🐛 Dạng 3: Bắt sâu sửa lỗi ngữ pháp';
        btn.style.display = 'none';
        renderBug(q, area);
      } else if (q.type === 'mcq') {
        document.getElementById('mission-type').textContent = '⚡ Dạng 4: Thử tài chọn đáp án đúng';
        btn.style.display = 'none';
        renderMcq(q, area);
      }
    }

    /* SCRAMBLE BUILDER */
    function renderScramble(q, container) {
      scrambleSelected = [];
      const tray = document.createElement('div');
      tray.className = 'tray-zone';
      tray.id = 'scramble-tray';

      const pool = document.createElement('div');
      pool.className = 'word-pool';
      pool.id = 'scramble-pool';

      const mixed = [...q.words].sort(() => Math.random() - 0.5);

      mixed.forEach((word, idx) => {
        const btn = document.createElement('button');
        btn.className = 'chip-btn';
        btn.textContent = word;
        btn.onclick = () => {
          playSound('click');
          scrambleSelected.push({ text: word, id: idx });
          btn.classList.add('hidden');
          updateScrambleTray(q);
        };
        pool.appendChild(btn);
      });

      container.appendChild(tray);
      container.appendChild(pool);
    }

    function updateScrambleTray(q) {
      const tray = document.getElementById('scramble-tray');
      tray.innerHTML = '';
      scrambleSelected.forEach((item, pos) => {
        const tag = document.createElement('button');
        tag.className = 'chip-btn tray-word';
        tag.textContent = item.text;
        tag.onclick = () => {
          playSound('click');
          const poolChips = document.querySelectorAll('#scramble-pool .chip-btn');
          poolChips[item.id].classList.remove('hidden');
          scrambleSelected.splice(pos, 1);
          updateScrambleTray(q);
        };
        tray.appendChild(tag);
      });
    }

    /* BASKET SORT */
    function renderSort(q, container) {
      sortState = {};
      q.baskets.forEach(b => sortState[b.id] = []);
      activeSortItem = null;

      const grid = document.createElement('div');
      grid.className = 'basket-grid';

      q.baskets.forEach(b => {
        const card = document.createElement('div');
        card.className = 'basket-card';
        card.onclick = () => onPutInBasket(b.id);

        const head = document.createElement('div');
        head.className = 'basket-title';
        head.style.background = b.bg;
        head.textContent = b.name;

        const box = document.createElement('div');
        box.className = 'basket-items-box';
        box.id = `box-${b.id}`;

        card.appendChild(head);
        card.appendChild(box);
        grid.appendChild(card);
      });

      const pool = document.createElement('div');
      pool.className = 'candidate-pool';

      q.items.forEach((it, idx) => {
        const btn = document.createElement('button');
        btn.className = 'candidate-btn';
        btn.id = `cand-${idx}`;
        btn.textContent = it.text;
        btn.onclick = () => {
          playSound('click');
          document.querySelectorAll('.candidate-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          activeSortItem = { ...it, idx };
        };
        pool.appendChild(btn);
      });

      container.appendChild(grid);
      container.appendChild(pool);
    }

    function onPutInBasket(basketId) {
      if (!activeSortItem) return;
      playSound('click');

      sortState[basketId].push(activeSortItem);
      document.getElementById(`cand-${activeSortItem.idx}`).style.display = 'none';

      const box = document.getElementById(`box-${basketId}`);
      const pill = document.createElement('span');
      pill.className = 'sorted-pill';
      pill.textContent = activeSortItem.text;
      box.appendChild(pill);

      activeSortItem = null;
    }

    /* BUG HUNTER */
    function renderBug(q, container) {
      const wrap = document.createElement('div');
      wrap.className = 'bug-stream';

      q.tokens.forEach(tok => {
        const btn = document.createElement('button');
        btn.className = 'chip-btn';
        btn.textContent = tok;
        btn.onclick = () => {
          if (isChecked) return;
          isChecked = true;
          const isRight = (tok === q.bugWord);
          if (isRight) {
            btn.style.background = '#FDEDEC';
            btn.style.borderColor = '#EB3B5A';
            btn.style.color = '#EB3B5A';
          }
          concludeAnswer(isRight);
        };
        wrap.appendChild(btn);
      });

      container.appendChild(wrap);
    }

    /* MULTI-CHOICE */
    function renderMcq(q, container) {
      const grid = document.createElement('div');
      grid.className = 'options-grid';

      q.options.forEach((opt, idx) => {
        const card = document.createElement('button');
        card.className = 'choice-card';
        card.innerHTML = `<span style="background: #F1F2F6; border-radius: 8px; width: 26px; height: 26px; display: inline-flex; align-items: center; justify-content: center; font-family: 'Fredoka One'; font-size: 13px;">${['A','B','C','D'][idx]}</span> <span>${opt}</span>`;
        card.onclick = () => {
          if (isChecked) return;
          isChecked = true;
          const allCards = document.querySelectorAll('.choice-card');
          allCards.forEach(c => c.disabled = true);

          if (idx === q.correct) {
            card.classList.add('correct');
            concludeAnswer(true);
          } else {
            card.classList.add('wrong');
            allCards[q.correct].classList.add('correct');
            concludeAnswer(false);
          }
        };
        grid.appendChild(card);
      });

      container.appendChild(grid);
    }

    /* SUBMIT & NEXT LOGIC */
    function onActionClick() {
      const q = testBank[currentIdx];
      const btn = document.getElementById('btn-submit');

      if (isChecked) {
        currentIdx++;
        if (currentIdx < testBank.length) {
          loadQuiz();
        } else {
          finishTest();
        }
        return;
      }

      isChecked = true;

      if (q.type === 'scramble') {
        const built = scrambleSelected.map(s => s.text).join(" ");
        concludeAnswer(built === q.solution);
      } else if (q.type === 'sort') {
        let ok = true;
        let count = 0;
        q.items.forEach(it => {
          if (!sortState[it.basket].some(x => x.text === it.text)) ok = false;
        });
        Object.values(sortState).forEach(arr => count += arr.length);
        if (count < q.items.length) ok = false;
        concludeAnswer(ok);
      }
    }

    function concludeAnswer(isCorrect) {
      const q = testBank[currentIdx];
      const btn = document.getElementById('btn-submit');

      if (isCorrect) {
        score += 10;
        streak += 1;
        playSound('win');
        setMascot('🥳', "Tuyệt cú mèo! Bé vừa ghi thêm 10 điểm xuất sắc! 🌟");
      } else {
        lives = Math.max(0, lives - 1);
        streak = 0;
        playSound('lose');
        setMascot('🥺', "Chưa chuẩn rồi! Nhưng đừng buồn, xem ngay bí kíp Cáo Vàng mách nhé! 💡");
      }

      document.getElementById('num-score').textContent = score;
      document.getElementById('num-lives').textContent = lives;
      document.getElementById('num-streak').textContent = streak;

      // Hiển thị giải thích
      let expHTML = q.tip;
      if (q.type === 'scramble') expHTML = `<b>Câu chuẩn:</b> "${q.solution}"<br>${q.tip}`;
      if (q.type === 'bug') expHTML = `<b>Từ sai cần sửa là:</b> "${q.bugWord}"<br>${q.tip}`;

      document.getElementById('exp-text').innerHTML = expHTML;
      document.getElementById('exp-panel').style.display = 'block';

      btn.style.display = 'block';
      btn.textContent = 'Tiếp Tục Chặng Đua ⏩';
    }

    function setMascot(emoji, txt) {
      document.getElementById('mascot-emoji').textContent = emoji;
      document.getElementById('mascot-msg').textContent = txt;
    }

    function finishTest() {
      document.getElementById('quiz-flow').style.display = 'none';
      document.getElementById('end-panel').style.display = 'block';

      document.getElementById('end-score').textContent = `${score} / 300 Điểm`;
      const title = document.getElementById('end-title');
      const desc = document.getElementById('end-desc');

      if (score >= 270) {
        title.textContent = 'Đại Pháp Sư Tiếng Anh 7! 👑';
        desc.textContent = 'Trình độ quá siêu đẳng! Bé đã làm chủ toàn bộ từ vựng và ngữ pháp Unit 1, 2, 3!';
      } else if (score >= 200) {
        title.textContent = 'Hiệp Sĩ Tài Năng! 🌟';
        desc.textContent = 'Bé hoàn thành rất tốt bài thi! Hãy xem lại các câu chưa đúng và chơi lại để đạt 300 tuyệt đối nhé!';
      } else {
        title.textContent = 'Chiến Binh Đang Lớn! 🌱';
        desc.textContent = 'Cố gắng rất đáng khen! Hãy cùng Cáo Vàng ôn lại mẹo và thử sức thêm một lần nữa nhé!';
      }
    }

    function resetQuiz() {
      currentIdx = 0;
      score = 0;
      lives = 3;
      streak = 0;
      document.getElementById('num-score').textContent = '0';
      document.getElementById('num-lives').textContent = '3';
      document.getElementById('num-streak').textContent = '0';
      document.getElementById('end-panel').style.display = 'none';
      document.getElementById('quiz-flow').style.display = 'flex';
      loadQuiz();
    }

    // Bắt đầu
    loadQuiz();
  </script>
